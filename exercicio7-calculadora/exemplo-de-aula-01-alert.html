<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript no head e no body</title>
    
    <style>
        .destaque{
            color: orange;
            font-size: 30px;
            font-weight: bold;
        }
    </style>

    <script>
        alert("Aviso bem poggers no cabeçalho");

    </script>
</head>
<body>
    <h1>JavaScript Incorporado</h1>
    
    <p>Este conteúdo foi escrito diretamente com HTML</p>

    <script>
        document.write('<p class="destaque">Este conteúdo foi escrito diretamente com JavaScript</p>');
    </script>
</body>
</html>
